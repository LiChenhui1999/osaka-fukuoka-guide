<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="大阪与福冈的经典景点及当地餐饮候选。">
  <meta name="theme-color" content="#fff8ed">
  <meta name="apple-mobile-web-app-title" content="大阪福冈指南">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png">
  <title>大阪・福冈｜景点餐馆候选</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #fff8ed;
      --surface: #fffdf8;
      --ink: #25231f;
      --muted: #706b62;
      --accent: #c34a36;
      --accent-soft: #f8e3da;
      --green: #197466;
      --green-soft: #dff1ec;
      --line: #e8ded0;
      --nav-width: min(82vw, 310px);
      --shadow: 0 18px 50px rgb(76 55 29 / 12%);
    }

    * { box-sizing: border-box; }

    html {
      scroll-behavior: smooth;
      background: var(--paper);
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        radial-gradient(circle at 100% 0, rgb(195 74 54 / 12%), transparent 27rem),
        radial-gradient(circle at 0 75%, rgb(25 116 102 / 10%), transparent 26rem),
        var(--paper);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC",
        "PingFang SC", "Hiragino Sans GB", sans-serif;
      line-height: 1.68;
    }

    button, a { -webkit-tap-highlight-color: transparent; }

    .menu-button {
      position: fixed;
      z-index: 40;
      top: max(14px, env(safe-area-inset-top));
      left: max(14px, env(safe-area-inset-left));
      display: grid;
      place-items: center;
      width: 46px;
      height: 46px;
      padding: 0;
      border: 1px solid rgb(255 255 255 / 60%);
      border-radius: 15px;
      color: #fff;
      background: var(--accent);
      box-shadow: 0 8px 22px rgb(195 74 54 / 28%);
      cursor: pointer;
      font-size: 1.35rem;
    }

    .menu-button:focus-visible,
    .nav-link:focus-visible,
    .welcome-link:focus-visible,
    .place-action:focus-visible,
    .city-jump-button:focus-visible {
      outline: 3px solid rgb(195 74 54 / 30%);
      outline-offset: 3px;
    }

    .sidebar {
      position: fixed;
      z-index: 30;
      inset: 0 auto 0 0;
      width: var(--nav-width);
      padding:
        max(80px, calc(env(safe-area-inset-top) + 70px))
        18px
        max(24px, env(safe-area-inset-bottom));
      overflow-y: auto;
      border-right: 1px solid var(--line);
      background: rgb(255 253 248 / 97%);
      box-shadow: var(--shadow);
      transform: translateX(-105%);
      transition: transform 220ms ease;
    }

    body.nav-open .sidebar { transform: translateX(0); }

    .nav-kicker {
      margin: 0 12px 6px;
      color: var(--accent);
      font-size: .72rem;
      font-weight: 800;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    .nav-title {
      margin: 0 12px 24px;
      font-family: "Songti SC", "Noto Serif SC", Georgia, serif;
      font-size: 1.45rem;
      font-weight: 800;
      line-height: 1.25;
    }

    .nav-list {
      display: grid;
      gap: 6px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .nav-link {
      display: flex;
      gap: 12px;
      align-items: center;
      min-height: 50px;
      padding: 11px 13px;
      border-radius: 13px;
      color: var(--ink);
      text-decoration: none;
      transition: background 140ms ease, color 140ms ease;
    }

    .nav-link:hover { background: #f5ede2; }

    .nav-link.active {
      color: var(--accent);
      background: var(--accent-soft);
      font-weight: 750;
    }

    .nav-number {
      min-width: 1.8rem;
      color: var(--muted);
      font-size: .73rem;
      font-variant-numeric: tabular-nums;
    }

    .backdrop {
      position: fixed;
      z-index: 20;
      inset: 0;
      visibility: hidden;
      background: rgb(34 30 25 / 38%);
      opacity: 0;
      transition: opacity 220ms ease, visibility 220ms ease;
    }

    body.nav-open .backdrop {
      visibility: visible;
      opacity: 1;
    }

    .page {
      width: min(100%, 920px);
      margin: 0 auto;
      padding:
        max(88px, calc(env(safe-area-inset-top) + 76px))
        max(18px, env(safe-area-inset-right))
        max(70px, env(safe-area-inset-bottom))
        max(18px, env(safe-area-inset-left));
      transition: transform 220ms ease;
    }

    .eyebrow {
      margin: 0 0 12px;
      color: var(--accent);
      font-size: .76rem;
      font-weight: 800;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    .welcome h1,
    .markdown h1,
    .markdown h2,
    .markdown h3 {
      font-family: "Songti SC", "Noto Serif SC", Georgia, serif;
      text-wrap: balance;
    }

    .welcome h1 {
      max-width: 700px;
      margin: 0;
      font-size: clamp(2.35rem, 10vw, 4.8rem);
      line-height: 1.08;
      letter-spacing: -.045em;
    }

    .lead {
      max-width: 630px;
      margin: 22px 0 34px;
      color: var(--muted);
      font-size: clamp(1rem, 3vw, 1.15rem);
    }

    .welcome-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
    }

    .welcome-link {
      min-height: 210px;
      padding: clamp(24px, 5vw, 38px);
      border: 1px solid rgb(232 222 208 / 85%);
      border-radius: 25px;
      color: var(--ink);
      background: rgb(255 253 248 / 94%);
      box-shadow: var(--shadow);
      text-decoration: none;
    }

    .welcome-link:nth-child(2) { background: rgb(223 241 236 / 88%); }
    .welcome-link:nth-child(3) { background: rgb(248 227 218 / 88%); }

    .card-number {
      display: block;
      margin-bottom: 40px;
      color: var(--accent);
      font-size: .74rem;
      font-weight: 800;
      letter-spacing: .12em;
    }

    .welcome-link:nth-child(2) .card-number { color: var(--green); }

    .card-title {
      display: block;
      font-family: "Songti SC", "Noto Serif SC", Georgia, serif;
      font-size: clamp(1.4rem, 5vw, 2rem);
      font-weight: 800;
    }

    .card-note {
      display: block;
      margin-top: 8px;
      color: var(--muted);
      font-size: .9rem;
    }

    .markdown {
      padding: clamp(24px, 6vw, 48px);
      border: 1px solid rgb(232 222 208 / 85%);
      border-radius: 26px;
      background: rgb(255 253 248 / 94%);
      box-shadow: var(--shadow);
    }

    .markdown h1 {
      margin: 0 0 1.15em;
      font-size: clamp(2rem, 8vw, 3.2rem);
      line-height: 1.1;
      letter-spacing: -.035em;
    }

    .markdown h2 {
      margin: 2em 0 .75em;
      padding-top: 1.15em;
      border-top: 1px solid var(--line);
      font-size: clamp(1.35rem, 5vw, 1.85rem);
      line-height: 1.25;
    }

    .markdown h1 + h2 { margin-top: 0; }

    .markdown h3 {
      margin: 1.7em 0 .55em;
      color: var(--accent);
      font-size: 1.08rem;
    }

    .markdown h3.region-heading {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px 12px;
    }

    .region-map-link {
      color: var(--accent);
      text-decoration: underline;
      text-decoration-color: rgb(195 74 54 / 28%);
      text-decoration-thickness: 1px;
      text-underline-offset: 4px;
    }

    .region-map-link:hover {
      text-decoration-color: currentColor;
    }

    .region-tags {
      display: inline-flex;
      flex-wrap: wrap;
      gap: 6px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .region-tag {
      padding: 4px 8px;
      border: 1px solid rgb(195 74 54 / 18%);
      border-radius: 999px;
      color: var(--muted);
      background: var(--paper);
      font-size: .7rem;
      font-weight: 700;
      line-height: 1;
    }

    .markdown p { margin: .65em 0; }

    .markdown ul {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr));
      gap: 10px;
      margin: .8em 0 1.4em;
      padding: 0;
      list-style: none;
    }

    .markdown li {
      min-height: 58px;
      padding: 15px 17px;
      border: 1px solid var(--line);
      border-radius: 15px;
      background: #fff;
    }

    .place-card {
      display: grid;
      gap: 12px;
      width: 100%;
    }

    .place-name {
      font-weight: 750;
    }

    .place-tags {
      color: var(--muted);
      font-size: .88rem;
    }

    .place-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .place-action {
      min-height: 36px;
      padding: 7px 11px;
      border: 1px solid var(--line);
      border-radius: 10px;
      color: var(--accent);
      background: var(--accent-soft);
      font: inherit;
      font-size: .78rem;
      font-weight: 750;
      line-height: 1.2;
      text-decoration: none;
      cursor: pointer;
    }

    .place-action.copy-name {
      color: var(--green);
      background: var(--green-soft);
    }

    .city-jump-controls {
      position: fixed;
      z-index: 25;
      right: max(16px, env(safe-area-inset-right));
      bottom: max(18px, env(safe-area-inset-bottom));
      display: grid;
      gap: 9px;
    }

    .city-jump-controls[hidden] { display: none; }

    .city-jump-button {
      display: grid;
      place-items: center;
      width: 48px;
      height: 48px;
      padding: 0;
      border: 1px solid rgb(255 255 255 / 65%);
      border-radius: 15px;
      color: #fff;
      background: var(--accent);
      box-shadow: 0 8px 22px rgb(76 55 29 / 20%);
      cursor: pointer;
      font-size: 1.35rem;
      font-weight: 800;
    }

    .city-jump-button:disabled {
      cursor: default;
      opacity: .35;
    }

    .markdown .task-list li {
      display: grid;
      grid-template-columns: 1.35rem 1fr;
      align-items: start;
      gap: .55rem;
      background: var(--green-soft);
    }

    .markdown input {
      width: 1.05rem;
      height: 1.05rem;
      margin: .32rem 0 0;
      accent-color: var(--green);
    }

    .loading, .error {
      padding: 48px 0;
      color: var(--muted);
      text-align: center;
    }

    .error strong {
      display: block;
      margin-bottom: 6px;
      color: var(--ink);
    }

    @media (min-width: 980px) {
      body.nav-open .backdrop { display: none; }
      body.nav-open .page { transform: translateX(calc(var(--nav-width) / 2)); }
    }

    @media (max-width: 560px) {
      .welcome-grid { grid-template-columns: 1fr; }
      .welcome-link { min-height: 180px; }
      .markdown { border-radius: 21px; }
      .markdown ul { grid-template-columns: 1fr 1fr; }
      .markdown li {
        display: grid;
        place-items: center;
        min-height: 72px;
        padding: 12px 9px;
        text-align: center;
        line-height: 1.4;
      }
      .place-actions { justify-content: center; }
      .markdown .task-list { grid-template-columns: 1fr; }
      .markdown .task-list li {
        min-height: 62px;
        padding: 14px;
        text-align: left;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      *, *::before, *::after { transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <button class="menu-button" id="menuButton" type="button"
    aria-label="打开导航" aria-controls="sidebar" aria-expanded="false">☰</button>

  <aside class="sidebar" id="sidebar" aria-label="页面导航">
    <p class="nav-kicker">Kansai & Kyushu</p>
    <p class="nav-title">大阪・福冈<br>景点餐馆候选</p>
    <nav>
      <ol class="nav-list">
        <li>
          <a class="nav-link" href="#welcome" data-page="welcome">
            <span class="nav-number">00</span><span>欢迎页</span>
          </a>
        </li>
        <li>
          <a class="nav-link" href="#spots" data-page="spots">
            <span class="nav-number">1</span><span>景点候选池</span>
          </a>
        </li>
        <li>
          <a class="nav-link" href="#food" data-page="food">
            <span class="nav-number">2</span><span>餐饮候选</span>
          </a>
        </li>
        <li>
          <a class="nav-link" href="#transport" data-page="transport">
            <span class="nav-number">3</span><span>交通导航</span>
          </a>
        </li>
      </ol>
    </nav>
  </aside>

  <div class="backdrop" id="backdrop" aria-hidden="true"></div>

  <main class="page" id="page" aria-live="polite"></main>

  <div class="city-jump-controls" id="cityJumpControls" aria-label="切换餐饮城市" hidden>
    <button class="city-jump-button" id="previousCity" type="button" aria-label="上一个城市">↑</button>
    <button class="city-jump-button" id="nextCity" type="button" aria-label="下一个城市">↓</button>
  </div>

  <template id="welcomeTemplate">
    <section class="welcome">
      <p class="eyebrow">Kansai & Kyushu City Guide</p>
      <h1>大阪・福冈<br>景点餐馆候选</h1>
      <p class="lead">两座城市的经典景点与当地餐饮备选，适合快速浏览和自由组合。</p>
      <div class="welcome-grid">
        <a class="welcome-link" href="#spots">
          <span class="card-number">1 · PLACES</span>
          <span class="card-title">景点候选池</span>
          <span class="card-note">大阪与福冈的城市地标、街区和体验。</span>
        </a>
        <a class="welcome-link" href="#food">
          <span class="card-number">2 · FOOD</span>
          <span class="card-title">餐饮候选</span>
          <span class="card-note">两地具有代表性的当地料理。</span>
        </a>
        <a class="welcome-link" href="#transport">
          <span class="card-number">3 · TRANSIT</span>
          <span class="card-title">交通导航</span>
          <span class="card-note">市内交通与跨城出行的快速入口。</span>
        </a>
      </div>
    </section>
  </template>

  <script>
    const pages = {
      welcome: { title: "大阪・福冈｜景点餐馆候选" },
      spots: { title: "景点候选池｜大阪・福冈", file: "1-景点候选池.md" },
      food: { title: "餐饮候选｜大阪・福冈", file: "2-餐饮候选.md" },
      transport: { title: "交通导航｜大阪・福冈", file: "3-交通导航.md" }
    };

    const body = document.body;
    const page = document.getElementById("page");
    const menuButton = document.getElementById("menuButton");
    const backdrop = document.getElementById("backdrop");
    const welcomeTemplate = document.getElementById("welcomeTemplate");
    const cityJumpControls = document.getElementById("cityJumpControls");
    const previousCityButton = document.getElementById("previousCity");
    const nextCityButton = document.getElementById("nextCity");
    let foodCityHeadings = [];

    function setNav(open) {
      body.classList.toggle("nav-open", open);
      menuButton.setAttribute("aria-expanded", String(open));
      menuButton.setAttribute("aria-label", open ? "关闭导航" : "打开导航");
      menuButton.textContent = open ? "×" : "☰";
    }

    function escapeHtml(text) {
      return text
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#39;");
    }

    function inlineMarkdown(text) {
      const links = [];
      const textWithLinkTokens = text.replace(
        /\[([^\]]+)\]\((https:\/\/www\.google\.com\/maps\/(?:search\/\?api=1&query=[^\s)]+|dir\/\?api=1&origin=[^\s)&]+&destination=[^\s)&]+&travelmode=transit))(?:\s+"([^"]+)")?\)(?:：\s*(.+))?$/g,
        (_, label, url, japaneseName, tags) => {
          const token = `MAP_LINK_TOKEN_${links.length}_END`;
          const isDirections = url.includes("/maps/dir/");
          const copyText = isDirections ? "" : japaneseName ||
            decodeURIComponent(new URL(url).searchParams.get("query") || "").replaceAll("+", " ");
          links.push(
            `<span class="place-card">` +
              `<span class="place-name">${escapeHtml(label)}</span>` +
              (tags ? `<span class="place-tags">${escapeHtml(tags)}</span>` : "") +
              `<span class="place-actions">` +
                `<a class="place-action" href="${escapeHtml(url)}" target="_blank" rel="noopener noreferrer" aria-label="在 Google Maps ${isDirections ? "导航" : "查看"}${escapeHtml(label)}">${isDirections ? "Google Maps 导航" : "Google Maps"}</a>` +
                (isDirections ? "" : `<button class="place-action copy-name" type="button" data-copy-text="${escapeHtml(copyText)}">复制日文名</button>`) +
              `</span>` +
            `</span>`
          );
          return token;
        }
      );

      return escapeHtml(textWithLinkTokens)
        .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
        .replace(/  $/, "<br>")
        .replace(/MAP_LINK_TOKEN_(\d+)_END/g, (_, index) => links[Number(index)]);
    }

    function renderMarkdown(markdown) {
      const lines = markdown.replace(/\r/g, "").split("\n");
      const html = [];
      let listOpen = false;
      let taskList = false;

      function closeList() {
        if (listOpen) html.push("</ul>");
        listOpen = false;
        taskList = false;
      }

      for (const line of lines) {
        const heading = line.match(/^(#{1,3})\s+(.+)$/);
        const task = line.match(/^-\s+\[([ xX])\]\s+(.+)$/);
        const item = line.match(/^-\s+(.+)$/);

        if (heading) {
          closeList();
          const level = heading[1].length;
          const regionParts = level === 3 ? heading[2].split("｜") : [];
          if (regionParts.length === 2) {
            const regionLink = regionParts[0].trim().match(
              /^\[([^\]]+)\]\((https:\/\/www\.google\.com\/maps\/search\/\?api=1&query=[^\s)]+)\)$/
            );
            const regionTitle = regionLink
              ? `<a class="region-map-link" href="${escapeHtml(regionLink[2])}" target="_blank" rel="noopener noreferrer">${escapeHtml(regionLink[1])}</a>`
              : inlineMarkdown(regionParts[0].trim());
            const tags = regionParts[1]
              .split("·")
              .map(tag => tag.trim())
              .filter(Boolean)
              .map(tag => `<span class="region-tag">${escapeHtml(tag)}</span>`)
              .join("");
            html.push(
              `<h3 class="region-heading">` +
                `<span>${regionTitle}</span>` +
                `<span class="region-tags">${tags}</span>` +
              `</h3>`
            );
          } else {
            html.push(`<h${level}>${inlineMarkdown(heading[2])}</h${level}>`);
          }
        } else if (task) {
          if (!listOpen || !taskList) {
            closeList();
            html.push('<ul class="task-list">');
            listOpen = true;
            taskList = true;
          }
          const checked = task[1].toLowerCase() === "x" ? " checked" : "";
          html.push(`<li><input type="checkbox"${checked} aria-label="候选项目"><span>${inlineMarkdown(task[2])}</span></li>`);
        } else if (item) {
          if (!listOpen || taskList) {
            closeList();
            html.push("<ul>");
            listOpen = true;
          }
          html.push(`<li>${inlineMarkdown(item[1])}</li>`);
        } else if (line.trim()) {
          closeList();
          html.push(`<p>${inlineMarkdown(line)}</p>`);
        } else {
          closeList();
        }
      }

      closeList();
      return html.join("\n");
    }

    async function copyToClipboard(text) {
      if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(text);
        return;
      }

      const textarea = document.createElement("textarea");
      textarea.value = text;
      textarea.setAttribute("readonly", "");
      textarea.style.position = "fixed";
      textarea.style.opacity = "0";
      document.body.appendChild(textarea);
      textarea.select();
      const copied = document.execCommand("copy");
      textarea.remove();
      if (!copied) throw new Error("Copy failed");
    }

    function currentPage() {
      const key = location.hash.slice(1);
      return pages[key] ? key : "welcome";
    }

    function currentFoodCityIndex() {
      if (!foodCityHeadings.length) return 0;
      const threshold = 150;
      let current = 0;
      foodCityHeadings.forEach((heading, index) => {
        if (heading.getBoundingClientRect().top <= threshold) current = index;
      });
      return current;
    }

    function updateCityJumpButtons() {
      if (cityJumpControls.hidden || !foodCityHeadings.length) return;
      const current = currentFoodCityIndex();
      previousCityButton.disabled = current === 0;
      nextCityButton.disabled = current === foodCityHeadings.length - 1;
    }

    function setUpCityJumps(pageKey) {
      foodCityHeadings = [];
      cityJumpControls.hidden = pageKey !== "food";
      if (pageKey !== "food") return;

      const cityNames = new Set(["大阪", "京都", "福冈"]);
      foodCityHeadings = [...page.querySelectorAll(".markdown h2")]
        .filter(heading => cityNames.has(heading.textContent.trim()));
      foodCityHeadings.forEach((heading, index) => {
        heading.id = `food-city-${index + 1}`;
      });
      updateCityJumpButtons();
    }

    function jumpFoodCity(offset) {
      if (!foodCityHeadings.length) return;
      const destination = Math.max(
        0,
        Math.min(foodCityHeadings.length - 1, currentFoodCityIndex() + offset)
      );
      foodCityHeadings[destination].scrollIntoView({ behavior: "smooth", block: "start" });
    }

    async function loadPage() {
      const key = currentPage();
      const config = pages[key];

      document.querySelectorAll(".nav-link").forEach(link => {
        const active = link.dataset.page === key;
        link.classList.toggle("active", active);
        if (active) link.setAttribute("aria-current", "page");
        else link.removeAttribute("aria-current");
      });

      document.title = config.title;

      if (key === "welcome") {
        page.replaceChildren(welcomeTemplate.content.cloneNode(true));
        setUpCityJumps(key);
      } else {
        page.innerHTML = '<div class="markdown"><p class="loading">正在载入内容…</p></div>';
        try {
          const response = await fetch(encodeURI(config.file));
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          page.innerHTML = `<article class="markdown">${renderMarkdown(await response.text())}</article>`;
          setUpCityJumps(key);
        } catch (error) {
          setUpCityJumps("");
          page.innerHTML = `
            <div class="markdown">
              <p class="error">
                <strong>无法载入内容</strong>
                请通过网页服务或 GitHub Pages 打开本页面。
              </p>
            </div>`;
        }
      }

      window.scrollTo({ top: 0, behavior: "instant" });
      if (window.innerWidth < 980) setNav(false);
    }

    menuButton.addEventListener("click", () => setNav(!body.classList.contains("nav-open")));
    backdrop.addEventListener("click", () => setNav(false));
    previousCityButton.addEventListener("click", () => jumpFoodCity(-1));
    nextCityButton.addEventListener("click", () => jumpFoodCity(1));
    window.addEventListener("scroll", updateCityJumpButtons, { passive: true });
    page.addEventListener("click", async event => {
      const button = event.target.closest(".copy-name");
      if (!button) return;

      const originalLabel = button.textContent;
      try {
        await copyToClipboard(button.dataset.copyText);
        button.textContent = "已复制";
      } catch {
        button.textContent = "复制失败";
      }
      window.setTimeout(() => {
        button.textContent = originalLabel;
      }, 1600);
    });
    document.addEventListener("keydown", event => {
      if (event.key === "Escape") setNav(false);
    });
    window.addEventListener("hashchange", loadPage);

    if (window.innerWidth >= 980) setNav(true);
    loadPage();
  </script>
</body>
</html>
